[package]
name = "agent-watcher"
version = "0.1.0"
edition = "2021"
default-run = "agent-watcher"
description = "Local Windows command audit collector and desktop log viewer"
publish = false

[lib]
name = "agent_watcher"

[[bin]]
name = "agent-watcher"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:eframe"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5"] }
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winreg = "0.55"

[profile.release]
strip = true
lto = "thin"
